# Configuration for indexing the MMU iris 500 pairs

public_dataset_root: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"

random_seed: 42

pair_generation:
  #genuine_per_identity: 5          # Or use max_genuine_pairs
  max_genuine_pairs: 250          # Hard limit, set to -1 for maximum possible pairs up to cap
  impostor_ratio: 1
  #max_impostor_pairs: 100         # no longer used

output:
  csv_path: "bioverify/data/pairs/pairs_iris_mmu_500.csv"
  relative_paths: true

# Just one small dataset for testing
datasets:
  - dataset_path: "Iris/002-MMU-Iris-Database"
    dataset_name: "MMU-Iris"
    modality: "iris"
    match_constraints:
      side: true
