# Test configuration for indexing - initial test for FingerVein dataset

public_dataset_root: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"

random_seed: 42

pair_generation:
  genuine_per_identity: 2          # Or use max_genuine_pairs
  max_genuine_pairs: 100          # Hard limit, set to -1 for maximum possible pairs up to cap
  impostor_ratio: 1.0
  #max_impostor_pairs: 100         # no longer used

output:
  csv_path: "bioverify/data/pairs/test001_finger_fingervein.csv"
  relative_paths: true

# Just one small dataset for testing
datasets:
  - dataset_path: "FingerVein/001-finger-vein/Finger Vein Database"
    dataset_name: "FingerVein"
    modality: "finger"
    match_constraints:
      side: True
      finger: True
