# Example Experiment: Multiple matcher evaluation on finger fvusm dataset 500 pairs
# This experiment evaluates multiple matchers on a single dataset (fingerfvusm).
# extracted vein

experiment:
  name: "All matchers 500 Finger FV-USM ROIs with CLAHE enhacement"
  description: "Evaluate multiple matchers on finger fvusm pairs"
  purpose: "multiple_matchers"
  created: "2026-03-08"

# Input pairs
dataset: "bioverify/data/pairs/pairs_finger_fvusm_500.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"
#filter_modality: "hand"

# Multiple matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: orb
    config_base: "bioverify/config/matching/orb.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: sift
    config_base: "bioverify/config/matching/sift.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: superglue
    config_base: "bioverify/config/matching/superglue.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: sgmnet
    config_base: "bioverify/config/matching/sgmnet.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: aspanformer
    config_base: "bioverify/config/matching/aspanformer.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: deepdetect
    config_base: "bioverify/config/matching/deepdetect.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false

# Output
output_dir: "bioverify/results/finger_fvusm_500_all_matchers_clahe"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
