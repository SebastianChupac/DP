# Example identification experiment using bruteforce (no optimization) strategy
# This is the baseline approach: all probes vs all gallery samples, then aggregate

experiment:
  name: "Identification bruteforce strategy example - Hand 11K, 50 IDs, baseline"
  description: "Baseline identification: Compare all probes against all gallery samples without optimization"
  purpose: "bruteforce_baseline_example"
  created: "2026-04-14"

# Input data
identification_dataset: "bioverify/data/identification/identification_hand_11khands_50_1_3_dorsal_right.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"

# Ranking Strategy: "cascade" for two-stage, "bruteforce" for all-against-all
ranking_strategy: "bruteforce"

# Samples per gallery: "single" (one sample per identity) or "multiple" (aggregate all samples)
samples_per_gallery: "multiple"
aggregation_method: "max"                # How to combine multiple gallery samples: "max" or "mean"

# Metrics
top_k_ranks: [1, 5, 10, 15]

# Matchers to evaluate
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      use_masking: true

  - name: superglue
    config_base: "bioverify/config/matching/superglue.yaml"
    config_overrides:
      use_masking: true

  - name: aspanformer
    config_base: "bioverify/config/matching/aspanformer.yaml"
    config_overrides:
      use_masking: true

  - name: sift-fingervein
    config_base: "bioverify/config/matching/sift_fingervein.yaml"
    config_overrides:
      use_masking: true

# Caching
cache_gallery_templates: true

# Output
output_dir: "bioverify/results/identification/bruteforce_hand_11khands_50_1_3_dorsal_right"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
