# Test experiment for identification. 11k hands, 50 identities, 1 probe, 1 gallery per identity
# masked and cropped

experiment:
  name: "Identification test experiment 11k hands 50 identities 1 probe 1 gallery dorsal right masked cropped all matchers cached"
  description: "Test identification on all matchers with masked and cropped images, with caching enabled"
  purpose: "id_test"
  created: "2026-04-12"

# Input data
identification_dataset: "bioverify/data/identification/identification_hand_11khands_50_1_1_dorsal_right.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"

strategy: "multiple"  # Use single gallery template per identity or multiple
top_k_ranks: [1, 5, 10]
aggregation_method: "max"  # Method to aggregate multiple matches if strategy is "multiple". Options: "max", "mean""
cache_gallery_templates: false

# Multiple matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["hand", "handgeometry"]
  - name: orb-fingervein
    config_base: "bioverify/config/matching/orb_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["hand", "handgeometry"]
  - name: sift-fingervein
    config_base: "bioverify/config/matching/sift_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["hand", "handgeometry"]
  - name: superglue-fingervein
    config_base: "bioverify/config/matching/superglue_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["hand", "handgeometry"]
  - name: sgmnet-fingervein
    config_base: "bioverify/config/matching/sgmnet_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["hand", "handgeometry"]
  - name: aspanformer
    config_base: "bioverify/config/matching/aspanformer.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["hand", "handgeometry"]
  - name: deepdetect
    config_base: "bioverify/config/matching/deepdetect.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["hand", "handgeometry"]

# Output
output_dir: "bioverify/results/identification/hand_11khands_50_1_1_dorsal_right_masked_cropped_all_matchers_cached.yaml"

# Options
batch_size: 1
verbose: true
device: "cuda"
