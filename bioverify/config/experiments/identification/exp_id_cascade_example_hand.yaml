# Example identification experiment using cascade (two-stage) strategy
# Compares cascade ranking (fast shortlist + detailed rerank) vs bruteforce brute-force ranking
# Cascade should be ~3-4x faster with minimal accuracy loss

experiment:
  name: "Identification cascade strategy example - Hand 11K, 50 IDs, cascade with K=15"
  description: "Two-stage identification: SIFT shortlist (K=15) + deep matcher reranking on shortlisted candidates"
  purpose: "cascade_optimization_example"
  created: "2026-04-14"

# Input data
identification_dataset: "bioverify/data/identification/identification_hand_11khands_50_1_3_dorsal_right.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"

# Ranking Strategy: "cascade" for two-stage, "bruteforce" for all-against-all
ranking_strategy: "cascade"

# Cascade-specific parameters
shortlist_matcher:
  name: "sift-fingervein"                # Fast matcher for stage 1 (shortlist creation)
  config_base: "bioverify/config/matching/sift_fingervein.yaml"
  config_overrides:
    use_masking: true
shortlist_k: 15                          # Number of top candidates to keep from shortlist

# Samples per gallery: "single" (one sample per identity) or "multiple" (aggregate all samples)
samples_per_gallery: "multiple"
aggregation_method: "max"                # How to combine multiple gallery samples: "max" or "mean"

# Metrics
top_k_ranks: [1, 5, 10, 15]              # Include recall@K thresholds to evaluate shortlist

# Matchers to evaluate on shortlisted candidates
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      use_masking: true

  - name: superglue
    config_base: "bioverify/config/matching/superglue.yaml"
    config_overrides:
      use_masking: true

  - name: aspanformer
    config_base: "bioverify/config/matching/aspanformer.yaml"
    config_overrides:
      use_masking: true

  - name: sift-fingervein
    config_base: "bioverify/config/matching/sift_fingervein.yaml"
    config_overrides:
      use_masking: true

# Caching
cache_gallery_templates: true

# Output
output_dir: "bioverify/results/identification/cascade_hand_11khands_50_1_3_dorsal_right"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
