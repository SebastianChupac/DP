# Test experiment for identification. 11k hands, 50 identities, 1 probe, 1 gallery per identity
# masked

experiment:
  name: "Identification test experiment 11k hands 50 identities 1 probe 1 gallery dorsal right masked sift-fingervein"
  description: "Test identification on sift-fingervein matcher"
  purpose: "id_test"
  created: "2026-04-12"

# Input data
identification_dataset: "bioverify/data/identification/identification_hand_11khands_50_1_1_dorsal_right.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"

strategy: "single"  # Use single gallery template per identity or multiple
top_k_ranks: [5, 10]
aggregation_method: "max"  # Method to aggregate multiple matches if strategy is "multiple". Options: "max", "mean""

# Multiple matcher configuration
matchers:
  - name: sift-fingervein
    config_base: "bioverify/config/matching/sift_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true

# Output
output_dir: "bioverify/results/identification/hand_11khands_50_1_1_dorsal_right_masked_sift_fingervein.yaml"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
