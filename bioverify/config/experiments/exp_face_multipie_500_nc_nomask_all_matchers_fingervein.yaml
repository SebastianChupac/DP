# Configuration file for evaluating multiple matchers on the Multi-PIE face dataset, 500 pairs, with no masking
# no masking
# with fingervein config for some moatchers

experiment:
  name: "All matchers 500 faces Multi-PIE with no masking and matched side and palmar/dorsal"
  description: "Evaluate multiple matchers on face Multi-PIE pairs"
  purpose: "multiple_matchers"
  created: "2026-03-10"

# Input pairs
dataset: "bioverify/data/pairs/pairs_face_multipie_500_nc.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"
#filter_modality: "hand"

# Multiple matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: orb-fingervein
    config_base: "bioverify/config/matching/orb_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: sift-fingervein
    config_base: "bioverify/config/matching/sift_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: superglue-fingervein
    config_base: "bioverify/config/matching/superglue_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: sgmnet-fingervein
    config_base: "bioverify/config/matching/sgmnet_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: aspanformer
    config_base: "bioverify/config/matching/aspanformer.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: deepdetect
    config_base: "bioverify/config/matching/deepdetect.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false

# Output
output_dir: "bioverify/results/face_multipie_500_nc_nomask_all_matchers_fingervein"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
