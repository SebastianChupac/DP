# Example Experiment: Multiple matcher evaluation on finger eemscdbm dataset 500 pairs
# This experiment evaluates multiple matchers on a single dataset (fingereemscdbm).
# masked

experiment:
  name: "All matchers 500 Finger EEMSC-DBM ROIs with CLAHE enhancement"
  description: "Evaluate multiple matchers on finger EEMSC-DBM pairs"
  purpose: "multiple_matchers"
  created: "2026-03-08"

# Input pairs
dataset: "bioverify/data/pairs/pairs_finger_eemscdbm_500.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"
#filter_modality: "hand"

# Multiple matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: true
  - name: orb-fingervein
    config_base: "bioverify/config/matching/orb_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: true
  - name: sift-fingervein
    config_base: "bioverify/config/matching/sift_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: true
  - name: superglue-fingervein
    config_base: "bioverify/config/matching/superglue_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: true
  - name: sgmnet-fingervein
    config_base: "bioverify/config/matching/sgmnet_fingervein.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: true
  - name: aspanformer
    config_base: "bioverify/config/matching/aspanformer.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: true
  - name: deepdetect
    config_base: "bioverify/config/matching/deepdetect.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: true

# Output
output_dir: "bioverify/results/finger_eemscdbm_500_all_matchers"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
