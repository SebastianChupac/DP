# Example Experiment: Threshold Tuning for LoFTR on Iris Data
# This experiment evaluates a single matcher (LoFTR) on a single dataset (iris)
# with varying confidence/inlier thresholds to find optimal parameters.

experiment:
  name: "LoFTR Threshold Tuning - Iris masked"
  description: "Evaluate LoFTR matcher with different confidence thresholds on iris pairs"
  purpose: "threshold_tuning"
  created: "2026-02-25"

# Input pairs
dataset: "bioverify/data/pairs/test001_iris_mmu.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"
filter_modality: "iris"

# Single matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Enable masking (requires precomputed masks in PublicDataset/_masks/)
      use_masking: true

# Output
output_dir: "bioverify/results/loftr_threshold_tuning_iris_masked"
save_visualization_results: true
save_pair_images: true

# Options
batch_size: 1
verbose: true
device: "cuda"
