# Example Experiment: Multiple matcher evaluation on hand dataset 1k pairs
# This experiment evaluates multiple matchers on a single dataset (hand).
# no masking

experiment:
  name: "All matchers 1k Hands no mask"
  description: "Evaluate multiple matchers on hands pairs"
  purpose: "multiple_matchers"
  created: "2026-03-04"

# Input pairs
dataset: "bioverify/data/pairs/test_1k_11khands.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"
#filter_modality: "hand"

# Multiple matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: orb
    config_base: "bioverify/config/matching/orb.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: sift
    config_base: "bioverify/config/matching/sift.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: superglue
    config_base: "bioverify/config/matching/superglue.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: sgmnet
    config_base: "bioverify/config/matching/sgmnet.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: aspanformer
    config_base: "bioverify/config/matching/aspanformer.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false
  - name: deepdetect
    config_base: "bioverify/config/matching/deepdetect.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: false

# Output
output_dir: "bioverify/results/1k_hands_nomask_all_matchers"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
