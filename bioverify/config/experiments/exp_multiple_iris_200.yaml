# Example Experiment: Multiple Matcher Evaluation on Iris Data
# This experiment evaluates multiple matchers on a single dataset (iris).

experiment:
  name: "Multiple matcher 200 Iris"
  description: "Evaluate multiple matchers on iris pairs"
  purpose: "multiple_matchers"
  created: "2026-03-03"

# Input pairs
dataset: "bioverify/data/pairs/test001_iris_mmu.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"
filter_modality: "iris"

# Multiple matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: false
  - name: orb
    config_base: "bioverify/config/matching/orb.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: false
  - name: sift
    config_base: "bioverify/config/matching/sift.yaml"
    config_overrides:
      # Disable masking for faster experiments
      #use_masking: false

# Output
output_dir: "bioverify/results/multiple_matchers_iris"
save_visualization_results: false
save_pair_images: false

# Options
batch_size: 1
verbose: true
device: "cuda"
