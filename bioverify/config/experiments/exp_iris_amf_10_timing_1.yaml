# Example Experiment: Multiple matcher evaluation on iris amf dataset 10 pairs
# This experiment evaluates multiple matchers on a single dataset (irisamf).
# masked

experiment:
  name: "Timing experiment 10 pairs Iris AMF masked"
  description: "Evaluate multiple matchers on iris amf pairs"
  purpose: "multiple_matchers"
  created: "2026-05-16"

# Input pairs
dataset: "bioverify/data/pairs/pairs_iris_amf_10_timing.csv"
base_path: "C:/Users/sebas/Documents/VUT_FIT_MIT/DP/PublicDataset"
#filter_modality: "hand"

profile_timings: true

# Multiple matcher configuration
matchers:
  - name: loftr
    config_base: "bioverify/config/matching/loftr.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
      roi_crop_modalities: ["iris"]
  - name: orb
    config_base: "bioverify/config/matching/orb.yaml"
    config_overrides:
      # Disable masking for faster experiments
      use_masking: true
      roi_crop_from_mask: true
