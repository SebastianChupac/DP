# SIFT Matcher Configuration
# Ported from SIFT/sift-orb.py

matcher:
  name: sift
  config:
    # Image preprocessing
    resize_width: 640
    resize_height: 480
    resize_keep_aspect: true
    
    # RANSAC parameters
    ransac_thresh: 5.0
    #ransac_max_iters: 10000
    min_matches: 4
    
    # Masking
    use_masking: true

    
    # Device
    device: cpu
    
    # SIFT detector parameters
    nfeatures: 0  # 0 = no limit
    n_octave_layers: 3
    contrast_threshold: 0.04
    edge_threshold: 10.0
    sigma: 1.6
    
    # FLANN matching options
    flann_trees: 5
    flann_checks: 50
    
    # Lowe's ratio test
    lowe_ratio: 0.75
    
    # Prediction threshold
    ratio_threshold: 0.45
