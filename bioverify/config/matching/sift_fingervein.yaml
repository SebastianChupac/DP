# SIFT Matcher Configuration - Optimized for Fingervein Images
# 
# Fingervein images are low-contrast, small ROI crops with subtle vein patterns.
# Standard SIFT parameters are too conservative and miss these weak features.
#
# Key changes from default SIFT config:
# - Lower contrast_threshold (0.04 → 0.01) to detect low-contrast vein lines
# - Higher edge_threshold (10 → 20) to accept more edge-like vein features
# - More octave layers for better scale detection in small images

matcher:
  name: sift
  config:
    # Image preprocessing
    resize_width: 640
    resize_height: 480
    resize_keep_aspect: true
    
    # RANSAC parameters
    ransac_thresh: 5.0
    min_matches: 4
    
    # Masking
    use_masking: true
    roi_crop_from_mask: false
    roi_crop_modalities: ["iris"]
    
    # Enhancement (CLAHE for fingervein)
    use_enhancement: true
    enhancement_clip_limit: 3.0
    enhancement_tile_size: 8
    
    # Device
    device: cpu
    
    # SIFT detector parameters - OPTIMIZED FOR FINGERVEIN
    nfeatures: 0  # 0 = no limit (detect as many as possible)
    n_octave_layers: 4  # Default: 3, More layers = better scale detection
    contrast_threshold: 0.01  # DEFAULT: 0.04, LOWERED for low-contrast veins
    edge_threshold: 20.0  # DEFAULT: 10.0, INCREASED to accept vein edges
    sigma: 1.6  # Default blur, keep standard
    
    # FLANN matching options
    flann_trees: 5
    flann_checks: 50
    
    # Lowe's ratio test threshold
    lowe_ratio: 0.75  # Standard ratio test
    
    # Prediction threshold
    ratio_threshold: 0.45

# Parameter explanation for fingervein:
#
# contrast_threshold: 
#   - Standard: 0.04 (designed for natural images with strong gradients)
#   - Fingervein: 0.01 (much lower to detect subtle vein patterns)
#   - Lower values = more sensitive but may detect noise
#   - Try: 0.005-0.02 range for different datasets
#
# edge_threshold:
#   - Standard: 10.0 (filters out edge-like features)
#   - Fingervein: 20.0 (more permissive for thin vein edges)
#   - Higher values = accept more edge-like features
#   - Veins are inherently edge-like, not blob-like
#
# n_octave_layers:
#   - Standard: 3
#   - Fingervein: 4 (more scales for small ROI images)
#   - More layers = better detection across scales
#
# nfeatures:
#   - Set to 0 (unlimited) to capture all possible features
#   - Fingervein images have few features to begin with
