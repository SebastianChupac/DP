# SGMNet Matcher Configuration
# Ported from SGMNet/SGMNet.py and SGMNet/configs/sgm_config.yaml

matcher:
  name: sgmnet
  config:
    # Image preprocessing
    resize_width: 640
    resize_height: 480
    resize_keep_aspect: true

    # RANSAC parameters
    ransac_thresh: 3.0
    ransac_max_iters: 10000
    min_matches: 4

    # Masking
    use_masking: true
    mask_cache_dir: null

    # Device
    device: cuda

    # Load color images for feature extraction (default is grayscale)
    color: false

    # Extractor configuration (from sgm_config.yaml)
    extractor:
      name: root
      num_kpt: 4000
      resize: [-1]
      det_th: 0.00001

    # Matcher configuration (from sgm_config.yaml)
    matcher:
      name: SGM
      model_dir: SGMNet/weights/sgm/root
      seed_top_k: [256, 256]
      seed_radius_coe: 0.01
      net_channels: 128
      layer_num: 9
      head: 4
      seedlayer: [0, 6]
      use_mc_seeding: true
      use_score_encoding: false
      conf_bar: [1.11, 0.1]
      sink_iter: [10, 100]
      detach_iter: 1000000
      p_th: 0.2

    # Prediction thresholds
    ratio_threshold: 0.4
    max_reprojection_error: 5.0

    # Iris masking parameter
    iris_exclude_pupil: true
