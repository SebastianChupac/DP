# LoFTR (Local Feature Transformer) Matcher Configuration
# Ported from LoFTR/LoFTR.py

matcher:
  name: loftr
  config:
    # Image preprocessing
    resize_width: 640
    resize_height: 480
    resize_keep_aspect: true
    
    # RANSAC parameters
    ransac_thresh: 5.0
    ransac_max_iters: 10000
    min_matches: 4
    
    # Masking
    use_masking: true
    roi_crop_from_mask: true
    roi_crop_modalities: ["iris"]
    
    # Device
    device: cuda
    
    # LoFTR model type: 'indoor' or 'outdoor'
    model_type: indoor

    # Minimal inference-safe LoFTR tuning passed to kornia.feature.LoFTR(config=...)
    # Only these keys are used by the matcher to avoid changing model architecture.
    loftr_config:
      match_coarse:
        # Coarse matching threshold (default: 0.2)
        # Lower -> more candidate matches (higher recall, more outliers)
        # Higher -> stricter matches (higher precision, fewer matches)
        thr: 0.2

        # Remove matches near image border by this many coarse-grid pixels (default: 2)
        # 0 keeps border matches; larger values are safer but can reduce recall.
        border_rm: 2

        # Dual-softmax temperature (default: 0.1)
        # Lower -> sharper assignment; higher -> softer assignment.
        # Suggested range for quick tuning: 0.05 to 0.2
        dsmax_temperature: 0.1
    
    # Confidence threshold for filtering matches
    # LoFTR outputs matches with confidence scores
    # Only matches with confidence >= threshold are kept
    confidence_threshold: 0.9
    
    # Prediction threshold
    ratio_threshold: 0.45
    
    # Iris masking parameter
    iris_exclude_pupil: true
